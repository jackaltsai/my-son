<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>九宮格寫作提問練習</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f6f3ee; --card:#fffdf9; --ink:#2b2622; --muted:#7a7068; --line:#e3dcd2;
    --accent:#c4552d; --accent-soft:#f6e4dc; --center:#2f3e46; --center-ink:#f6f3ee;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans TC",system-ui,sans-serif;line-height:1.6}
  .wrap{max-width:1080px;margin:0 auto;padding:28px 20px 60px}
  header h1{font-family:"Noto Serif TC",serif;font-size:28px;margin:0 0 4px;letter-spacing:.04em}
  header p{margin:0;color:var(--muted);font-size:14px}
  .toolbar{display:flex;flex-wrap:wrap;gap:10px;margin:20px 0 16px;align-items:center}
  button{font:inherit;cursor:pointer;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:8px 14px;font-size:14px;transition:.15s}
  button:hover{border-color:var(--accent);color:var(--accent)}
  button.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
  button.primary:hover{filter:brightness(1.08);color:#fff}
  label.opt{font-size:14px;color:var(--muted);display:flex;align-items:center;gap:6px;margin-left:auto}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
  .cell{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:8px;min-height:220px}
  .cell .top{display:flex;justify-content:space-between;align-items:center;gap:8px}
  .tag{font-size:12px;font-weight:700;color:var(--accent);background:var(--accent-soft);padding:2px 8px;border-radius:999px;letter-spacing:.03em}
  .kind{font-size:11px;color:var(--muted);margin-left:6px}
  .reroll{padding:2px 8px;font-size:13px;border-radius:6px}
  .q{font-weight:500;font-size:15px;min-height:48px}
  textarea{width:100%;flex:1;min-height:80px;resize:vertical;border:1px dashed var(--line);border-radius:8px;padding:8px;font:inherit;font-size:14px;background:#fff;color:var(--ink)}
  textarea:focus{outline:none;border-color:var(--accent);border-style:solid}
  .cell.center{background:var(--center);color:var(--center-ink);border-color:var(--center);justify-content:center;align-items:stretch}
  .cell.center .lbl{font-size:12px;opacity:.75;letter-spacing:.1em}
  .cell.center input{width:100%;font:inherit;font-family:"Noto Serif TC",serif;font-size:22px;font-weight:700;text-align:center;padding:14px 8px;border-radius:8px;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.06);color:var(--center-ink)}
  .cell.center input::placeholder{color:rgba(246,243,238,.45);font-weight:400}
  .cell.center input:focus{outline:none;border-color:#fff}
  .cell.center .pick{display:flex;gap:6px}
  .cell.center select{flex:1;min-width:0;font:inherit;font-size:14px;padding:6px 8px;border-radius:8px;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.06);color:var(--center-ink)}
  .cell.center select option,.cell.center select optgroup{color:var(--ink);background:#fff}
  .cell.center .pick button{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.25);color:var(--center-ink);padding:6px 10px}
  .cell.center .pick button:hover{border-color:#fff}
  .cell.center .hint{font-size:12px;opacity:.7;text-align:center}
  .count{font-size:12px;color:var(--muted);text-align:right}
  section.out{margin-top:28px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px}
  section.out h2{font-size:16px;margin:0 0 10px;display:flex;justify-content:space-between;align-items:center}
  pre{white-space:pre-wrap;font:inherit;font-size:14px;margin:0;color:var(--ink);max-height:320px;overflow:auto}
  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:8px 16px;border-radius:8px;font-size:14px;opacity:0;pointer-events:none;transition:.2s}
  .toast.show{opacity:1}
  .tips{margin-top:16px;font-size:13px;color:var(--muted)}
  button.pdf{background:var(--center);color:var(--center-ink);border-color:var(--center)}
  button.pdf:hover{color:#fff;filter:brightness(1.2)}
  button.pdf.ready{background:var(--accent);border-color:var(--accent)}
  button.pdf:disabled{opacity:.6;cursor:wait}
  #progress{font-size:12px;opacity:.85;margin-left:4px}
  /* offscreen A4 print layout */
  #sheet{position:fixed;left:-10000px;top:0;width:794px;background:#fff;color:#2b2622;padding:40px 36px;font-family:"Noto Sans TC",sans-serif}
  #sheet h1{font-family:"Noto Serif TC",serif;font-size:24px;margin:0 0 2px}
  #sheet .meta{font-size:12px;color:#7a7068;margin-bottom:18px}
  #sheet .g{display:grid;grid-template-columns:repeat(3,1fr);border:1.5px solid #2b2622}
  #sheet .c{border:.75px solid #bfb6aa;padding:10px;font-size:12.5px;line-height:1.55;min-height:150px}
  #sheet .c .t{font-size:10.5px;font-weight:700;color:#c4552d;letter-spacing:.03em}
  #sheet .c .qq{font-weight:700;margin:2px 0 6px}
  #sheet .c .a{white-space:pre-wrap}
  #sheet .c .a.empty{color:#aaa}
  #sheet .c.mid{background:#2f3e46;color:#f6f3ee;display:flex;align-items:center;justify-content:center;text-align:center;font-family:"Noto Serif TC",serif;font-size:20px;font-weight:700}
  #sheet h2{font-size:15px;margin:24px 0 8px}
  #sheet .notes{border:1px solid #bfb6aa;border-radius:6px;height:260px;background:repeating-linear-gradient(#fff 0 31px,#e3dcd2 31px 32px)}
  section.org{margin-top:28px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px}
  section.org h2{font-size:16px;margin:0 0 4px}
  section.org .sub{font-size:13px;color:var(--muted);margin:0 0 12px}
  .item{display:flex;align-items:flex-start;gap:10px;border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px;background:#fff;transition:.15s}
  .item.off{opacity:.45}
  .item.dragover{border-color:var(--accent);background:var(--accent-soft)}
  .item .handle{cursor:grab;color:var(--muted);user-select:none;padding-top:2px}
  .item .body{flex:1;min-width:0}
  .item .iq{font-size:12px;color:var(--muted)}
  .item .ia{font-size:14px;white-space:pre-wrap;word-break:break-word}
  .item .ctl{display:flex;gap:4px;align-items:center;flex-wrap:wrap}
  .item .ctl button{padding:2px 8px;font-size:13px}
  .type{font-size:12px;font-weight:700}
  .type.fact{background:#e2ecf3;color:#2f5d7a;border-color:#c5d8e5}
  .type.opin{background:var(--accent-soft);color:var(--accent);border-color:#ecc7b8}
  .empty-note{font-size:13px;color:var(--muted)}
  #outline{margin-top:14px}
  .ol h3{font-size:14px;margin:12px 0 4px;color:var(--accent)}
  .ol ul{margin:0;padding-left:20px;font-size:14px}
  .ol li{margin-bottom:4px}
  .ol .hint{color:var(--muted);font-size:13px}
  @media (max-width:720px){
    .grid{grid-template-columns:1fr}
    .cell.center{order:-1;min-height:auto}
    label.opt{margin-left:0}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>九宮格寫作提問練習</h1>
    <p>中心寫主題，周圍 8 格用 7W3H 隨機出題。先回答，再挑素材組成文章。</p>
  </header>

  <div class="toolbar">
    <button class="primary" id="shuffleAll">🎲 全部重新出題</button>
    <button id="clearAns">清空答案</button>
    <button id="clearAll">全部重來</button>
    <button id="pdfBtn" class="pdf" hidden>📄 輸出 PDF <span id="progress"></span></button>
    <label class="opt"><input type="checkbox" id="noRepeat" checked> 8 格不重複類別</label>
  </div>

  <div class="grid" id="grid"></div>

  <section class="out">
    <h2>問答整理 <button id="copyBtn">複製</button></h2>
    <pre id="output">（填入主題與答案後，這裡會自動整理成文字）</pre>
  </section>

  <section class="org">
    <h2>③④ 分類・排序・文章骨架</h2>
    <p class="sub">把回答標成「事實」或「感受／意見」，勾選要用的素材，拖曳（或按 ▲▼）排好順序，下方就會產生文章大綱。</p>
    <div id="items"></div>
    <h2 style="margin-top:16px;display:flex;justify-content:space-between;align-items:center">文章大綱 <button id="copyOutline">複製大綱</button></h2>
    <div id="outline" class="ol"></div>
  </section>

  <p class="tips">小提示：「基礎問題」的答案是事實；「鏟子問題」的答案因人而異，最能挖出你自己的觀點。回答不出來的格子，按 ↻ 換一題就好。</p>
</div>
<div class="toast" id="toast"></div>
<div id="sheet" aria-hidden="true"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<script>
const BANK = {
  "Who": [
    ["誰會在意「{t}」？","鏟子"],
    ["「{t}」讓你想到哪個人？","鏟子"],
    ["誰對「{t}」的影響最大？","基礎"],
    ["誰是「{t}」的關鍵人物？","基礎"],
    ["你最想把「{t}」說給誰聽？","鏟子"]
  ],
  "What": [
    ["「{t}」最核心的是什麼？","鏟子"],
    ["關於「{t}」，大家最常誤會什麼？","鏟子"],
    ["「{t}」帶給你什麼改變？","鏟子"],
    ["「{t}」最讓你印象深刻的一幕是什麼？","鏟子"],
    ["「{t}」具體是指什麼？","基礎"]
  ],
  "When": [
    ["你第一次接觸「{t}」是什麼時候？","基礎"],
    ["什麼時候最需要「{t}」？","鏟子"],
    ["「{t}」最好的時機是何時？","鏟子"],
    ["五年後的「{t}」會變成什麼樣？","鏟子"],
    ["「{t}」通常發生在什麼時候？","基礎"]
  ],
  "Where": [
    ["「{t}」發生在哪裡？","基礎"],
    ["在哪裡最能感受到「{t}」？","鏟子"],
    ["關於「{t}」的資訊可以去哪裡找？","基礎"],
    ["「{t}」最適合在什麼場合談？","鏟子"]
  ],
  "Why": [
    ["為什麼「{t}」值得寫？","鏟子"],
    ["為什麼你在意「{t}」？","鏟子"],
    ["為什麼有人反對或不喜歡「{t}」？","鏟子"],
    ["為什麼「{t}」現在特別重要？","鏟子"],
    ["「{t}」為什麼會出現？","基礎"]
  ],
  "Which": [
    ["「{t}」中你最喜歡哪一部分？","鏟子"],
    ["如果只能留一個重點，你選哪一個？","鏟子"],
    ["和類似的事比，「{t}」哪裡不一樣？","鏟子"],
    ["哪一個例子最能說明「{t}」？","鏟子"]
  ],
  "Whom": [
    ["「{t}」是為了誰？","基礎"],
    ["「{t}」對誰最有幫助？","鏟子"],
    ["這篇談「{t}」的文章，你想寫給誰看？","鏟子"],
    ["「{t}」會讓誰受到影響？","基礎"]
  ],
  "How": [
    ["「{t}」是怎麼開始的？","基礎"],
    ["你怎麼看「{t}」？","鏟子"],
    ["怎樣才能把「{t}」做得更好？","鏟子"],
    ["「{t}」給你什麼感受？","鏟子"],
    ["如果要教別人「{t}」，你會怎麼教？","鏟子"]
  ],
  "How many": [
    ["「{t}」牽涉到多少人或事？","基礎"],
    ["你在「{t}」上投入過幾次、多少時間？","基礎"],
    ["「{t}」有幾個關鍵步驟或要素？","基礎"]
  ],
  "How much": [
    ["「{t}」要花多少錢或成本？","基礎"],
    ["「{t}」對你有多重要（1–10 分）？為什麼？","鏟子"],
    ["「{t}」前後改變了多少？","基礎"]
  ]
};
const TOPICS = {
  "生活日常": ["我的早晨習慣","一道最常吃的菜","通勤路上","週末怎麼過","房間裡最重要的東西","最近買過最值得的東西"],
  "回憶經驗": ["第一次獨自旅行","一位影響我的老師","最難忘的一頓飯","一次失敗的經驗","小時候的夢想","最近一次被感動"],
  "工作學習": ["我為什麼選這份工作","最近學會的一件事","一次成功的活動","和同事合作的經驗","我怎麼安排時間","工作中最有成就感的時刻"],
  "興趣嗜好": ["我喜歡的一首歌","一本推薦的書","正在練習的興趣","一部看了好幾次的電影","最想去的地方","手機裡最常用的 App"],
  "觀點議題": ["AI 會改變我的工作嗎","年輕人該不該存錢","手機是否讓人更孤單","值得排隊的美食","理想的週休制度","學歷還重要嗎"],
  "介紹推薦": ["介紹我的家鄉","推薦一間小店","向新同事介紹我的單位","一個好用的小技巧","我的私房景點","一項值得學的技能"]
};
const CATS = Object.keys(BANK);
const POS = [0,1,2,3,5,6,7,8]; // grid positions around center (4)

let state = { topic:"", cells: [], order: [0,1,2,3,4,5,6,7] }; // cells: {cat, idx, ans, type, use}
const defType = c => BANK[c.cat][c.idx][1]==="基礎" ? "事實" : "意見";

const rand = n => Math.floor(Math.random()*n);
function pickCats(){
  if(document.getElementById('noRepeat').checked){
    const c=[...CATS]; for(let i=c.length-1;i>0;i--){const j=rand(i+1);[c[i],c[j]]=[c[j],c[i]];}
    return c.slice(0,8);
  }
  return Array.from({length:8},()=>CATS[rand(CATS.length)]);
}
function newCell(cat, prevIdx){
  const list=BANK[cat]; let idx=rand(list.length);
  if(list.length>1 && idx===prevIdx) idx=(idx+1)%list.length;
  const n={cat, idx, ans:""}; n.type=defType(n); n.use=true; return n;
}
function shuffleAll(keepAns){
  const cats=pickCats();
  state.cells = cats.map((c,i)=>{ const n=newCell(c); if(keepAns && state.cells[i]) n.ans=state.cells[i].ans; return n; });
  state.order=[0,1,2,3,4,5,6,7];
}
function rerollOne(i){
  const used=new Set(state.cells.map(c=>c.cat));
  let cat=state.cells[i].cat;
  if(document.getElementById('noRepeat').checked){
    const free=CATS.filter(c=>!used.has(c));
    // swap to an unused category half the time, else new question in same category
    if(free.length && Math.random()<0.5) cat=free[rand(free.length)];
  } else if(Math.random()<0.5){ cat=CATS[rand(CATS.length)]; }
  const n=newCell(cat, cat===state.cells[i].cat?state.cells[i].idx:-1);
  n.ans=state.cells[i].ans; n.use=state.cells[i].use!==false;
  state.cells[i]=n;
}
const topicText = () => state.topic.trim() || "這個主題";
const qText = c => BANK[c.cat][c.idx][0].replaceAll("{t}", topicText());

function save(){ try{ localStorage.setItem('ninegrid-writing', JSON.stringify(state)); }catch(e){} }
function load(){
  try{ const s=JSON.parse(localStorage.getItem('ninegrid-writing')||'null');
    if(s && Array.isArray(s.cells) && s.cells.length===8 && s.cells.every(c=>BANK[c.cat] && BANK[c.cat][c.idx])){
      s.cells.forEach(c=>{ if(c.type!=="事實"&&c.type!=="意見") c.type=defType(c); if(typeof c.use!=="boolean") c.use=true; });
      const o=s.order; if(!Array.isArray(o)||o.length!==8||[...o].sort().join()!=="0,1,2,3,4,5,6,7") s.order=[0,1,2,3,4,5,6,7];
      state=s; return true; }
  }catch(e){}
  return false;
}

const grid=document.getElementById('grid');
function render(){
  grid.innerHTML="";
  for(let p=0;p<9;p++){
    const el=document.createElement('div');
    if(p===4){
      el.className="cell center";
      el.innerHTML=`<div class="lbl">主 題</div>
        <input id="topic" placeholder="輸入主題，例如：第一次露營" maxlength="30">
        <div class="pick">
          <select id="topicList"><option value="">📋 從清單挑主題…</option>${
            Object.entries(TOPICS).map(([g,arr])=>`<optgroup label="${g}">${arr.map(t=>`<option>${t}</option>`).join("")}</optgroup>`).join("")
          }</select>
          <button id="randTopic" title="隨機抽主題">🎲</button>
        </div>
        <div class="hint">題目會自動帶入你的主題</div>`;
      grid.appendChild(el);
      const inp=el.querySelector('#topic'); inp.value=state.topic;
      const setTopic=v=>{ state.topic=v; inp.value=v; updateQuestions(); updateOutput(); save(); };
      inp.addEventListener('input',()=>setTopic(inp.value));
      const sel=el.querySelector('#topicList');
      sel.addEventListener('change',()=>{ if(sel.value) setTopic(sel.value); sel.value=""; });
      el.querySelector('#randTopic').addEventListener('click',()=>{
        const all=Object.values(TOPICS).flat().filter(t=>t!==state.topic);
        setTopic(all[rand(all.length)]);
      });
      continue;
    }
    const i=POS.indexOf(p), c=state.cells[i];
    el.className="cell"; el.dataset.i=i;
    el.innerHTML=`<div class="top"><span><span class="tag">${c.cat}</span><span class="kind">${BANK[c.cat][c.idx][1]}問題</span></span>
      <button class="reroll" title="換一題">↻</button></div>
      <div class="q"></div>
      <textarea placeholder="寫下你的回答…"></textarea>
      <div class="count"></div>`;
    el.querySelector('.q').textContent=qText(c);
    const ta=el.querySelector('textarea'); ta.value=c.ans;
    const cnt=el.querySelector('.count'); cnt.textContent=c.ans.length?c.ans.length+" 字":"";
    ta.addEventListener('input',()=>{ c.ans=ta.value; cnt.textContent=ta.value.length?ta.value.length+" 字":""; updateOutput(); save(); });
    el.querySelector('.reroll').addEventListener('click',()=>{ rerollOne(i); render(); save(); });
    grid.appendChild(el);
  }
  updateOutput();
}
function updateQuestions(){
  grid.querySelectorAll('.cell[data-i]').forEach(el=>{ el.querySelector('.q').textContent=qText(state.cells[+el.dataset.i]); });
}
function buildText(){
  const lines=[`主題：${state.topic.trim()||"（未填）"}`,""];
  state.cells.forEach((c,k)=>{
    lines.push(`${k+1}. 【${c.cat}】${qText(c)}`);
    lines.push(`   → ${c.ans.trim()||"（未回答）"}`);
  });
  return lines.join("\n");
}
function updateProgress(){
  const done=state.cells.filter(c=>c.ans.trim()).length;
  const p=document.getElementById('progress'); if(!p) return;
  p.textContent=`${done}/8`;
  document.getElementById('pdfBtn').classList.toggle('ready', done===8 && !!state.topic.trim());
}
function updateOutput(){
  updateProgress(); renderOrganizer();
  const any=state.topic.trim()||state.cells.some(c=>c.ans.trim());
  document.getElementById('output').textContent= any?buildText():"（填入主題與答案後，這裡會自動整理成文字）";
}
function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),1600); }

document.getElementById('shuffleAll').addEventListener('click',()=>{
  const hasAns=state.cells.some(c=>c.ans.trim());
  shuffleAll(false);
  if(hasAns) toast("已換新題目，答案已清空");
  render(); save();
});
document.getElementById('clearAns').addEventListener('click',()=>{ state.cells.forEach(c=>c.ans=""); render(); save(); toast("答案已清空"); });
document.getElementById('clearAll').addEventListener('click',()=>{ state.topic=""; shuffleAll(false); render(); save(); });
document.getElementById('copyBtn').addEventListener('click',async()=>{
  try{ await navigator.clipboard.writeText(buildText()); toast("已複製"); }
  catch(e){
    const r=document.createRange(); r.selectNodeContents(document.getElementById('output'));
    const s=getSelection(); s.removeAllRanges(); s.addRange(r); toast("已選取文字，請按 Ctrl/⌘+C 複製");
  }
});

// ---------- 分類・排序・文章骨架 ----------
const itemsEl=document.getElementById('items');
function moveOrder(from,to){
  if(to<0||to>7||from===to) return;
  const [x]=state.order.splice(from,1); state.order.splice(to,0,x);
  save(); renderOrganizer();
}
function renderOrganizer(){
  // 輸入文字時不重建清單（避免失焦），只在結構變動時重建；這裡簡單起見每次重建但保留捲動
  itemsEl.innerHTML="";
  const withAns=state.order.filter(i=>state.cells[i].ans.trim());
  if(!withAns.length){
    itemsEl.innerHTML='<p class="empty-note">先在上面的九宮格寫下回答，有內容的格子會出現在這裡。</p>';
  }
  state.order.forEach((ci,pos)=>{
    const c=state.cells[ci]; if(!c.ans.trim()) return;
    const el=document.createElement('div');
    el.className="item"+(c.use?"":" off"); el.draggable=true; el.dataset.pos=pos;
    el.innerHTML=`<span class="handle" title="拖曳排序">⠿</span>
      <input type="checkbox" ${c.use?"checked":""} title="使用這項素材">
      <div class="body"><div class="iq"></div><div class="ia"></div></div>
      <div class="ctl"><button class="type ${c.type==="事實"?"fact":"opin"}" title="切換：事實／感受・意見">${c.type==="事實"?"事實":"感受／意見"}</button>
      <button class="up" title="上移">▲</button><button class="dn" title="下移">▼</button></div>`;
    el.querySelector('.iq').textContent=`【${c.cat}】${qText(c)}`;
    el.querySelector('.ia').textContent=c.ans.trim();
    el.querySelector('input').addEventListener('change',e=>{ c.use=e.target.checked; save(); renderOrganizer(); });
    el.querySelector('.type').addEventListener('click',()=>{ c.type=c.type==="事實"?"意見":"事實"; save(); renderOrganizer(); });
    el.querySelector('.up').addEventListener('click',()=>moveOrder(pos,prevPos(pos,-1)));
    el.querySelector('.dn').addEventListener('click',()=>moveOrder(pos,prevPos(pos,1)));
    el.addEventListener('dragstart',e=>{ e.dataTransfer.setData('text/plain',String(pos)); e.dataTransfer.effectAllowed='move'; });
    el.addEventListener('dragover',e=>{ e.preventDefault(); el.classList.add('dragover'); });
    el.addEventListener('dragleave',()=>el.classList.remove('dragover'));
    el.addEventListener('drop',e=>{ e.preventDefault(); el.classList.remove('dragover');
      const from=+e.dataTransfer.getData('text/plain'); if(!isNaN(from)) moveOrder(from,pos); });
    itemsEl.appendChild(el);
  });
  document.getElementById('outline').innerHTML=outlineHtml();
}
// 上移／下移時跳過沒有回答的格子
function prevPos(pos,dir){
  let t=pos+dir; while(t>=0&&t<8&&!state.cells[state.order[t]].ans.trim()) t+=dir;
  return t;
}
function outlineParts(){
  const sel=state.order.map(i=>state.cells[i]).filter(c=>c.use&&c.ans.trim());
  const n=sel.length;
  if(n===0) return null;
  if(n<3) return {head:[],body:sel,tail:[]};
  return {head:[sel[0]],body:sel.slice(1,-1),tail:[sel[n-1]]};
}
const brief = a => { const t=a.trim().replace(/\s+/g," "); return t.length>60?t.slice(0,60)+"…":t; };
function outlineData(){
  const p=outlineParts(); if(!p) return null;
  const mk=c=>({type:c.type==="事實"?"事實":"感受／意見", q:qText(c), a:brief(c.ans)});
  return {topic:topicText(), head:p.head.map(mk), body:p.body.map(mk), tail:p.tail.map(mk)};
}
function outlineHtml(){
  const d=outlineData();
  if(!d) return '<p class="empty-note">勾選至少一項素材後，這裡會產生「開頭／本文／結論」大綱。</p>';
  const li=x=>`<li><b>[${x.type}]</b> ${esc(x.a)}<br><span class="hint">${esc(x.q)}</span></li>`;
  const sec=(t,hint,arr)=>`<h3>${t}</h3>`+(arr.length?`<ul>${arr.map(li).join("")}</ul>`:`<p class="hint">${hint}</p>`);
  return `<p><b>主題：</b>${esc(d.topic)}</p>`
    + sec("開頭","（素材少於 3 項，先全部放在本文。可用一句話點出主題與寫作動機。）",d.head)
    + sec("本文","（尚無素材）",d.body)
    + sec("結論","（可用一句話收尾：你的結論、感受或給讀者的建議。）",d.tail);
}
function outlineText(){
  const d=outlineData(); if(!d) return "";
  const f=x=>`  ・[${x.type}] ${x.a}`;
  const sec=(t,arr)=>arr.length?`${t}\n${arr.map(f).join("\n")}`:`${t}\n  （自行補寫）`;
  return [`主題：${d.topic}`,"",sec("【開頭】",d.head),"",sec("【本文】",d.body),"",sec("【結論】",d.tail)].join("\n");
}
document.getElementById('copyOutline').addEventListener('click',async()=>{
  const t=outlineText(); if(!t){ toast("還沒有可用的素材"); return; }
  try{ await navigator.clipboard.writeText(t); toast("大綱已複製"); }
  catch(e){ const r=document.createRange(); r.selectNodeContents(document.getElementById('outline'));
    const s=getSelection(); s.removeAllRanges(); s.addRange(r); toast("已選取文字，請按 Ctrl/⌘+C 複製"); }
});

// ---------- PDF export ----------
const esc = s => s.replace(/[&<>"]/g, ch=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[ch]));
function buildSheet(){
  const sheet=document.getElementById('sheet');
  const d=new Date(), date=`${d.getFullYear()}/${d.getMonth()+1}/${d.getDate()}`;
  let cells="";
  for(let p=0;p<9;p++){
    if(p===4){ cells+=`<div class="c mid">${esc(state.topic.trim()||"（未填主題）")}</div>`; continue; }
    const c=state.cells[POS.indexOf(p)], a=c.ans.trim();
    cells+=`<div class="c"><div class="t">${c.cat}・${BANK[c.cat][c.idx][1]}問題</div>
      <div class="qq">${esc(qText(c))}</div>
      <div class="a ${a?"":"empty"}">${a?esc(a):"（未回答）"}</div></div>`;
  }
  sheet.innerHTML=`<h1>九宮格寫作練習</h1>
    <div class="meta">主題：${esc(state.topic.trim()||"（未填）")}　｜　日期：${date}</div>
    <div class="g">${cells}</div>
    <h2>文章構想筆記</h2><div class="notes"></div>`;
  return sheet;
}
async function makePdf(){
  if(!window.html2canvas || !window.jspdf) throw new Error("lib");
  try{ await document.fonts.ready; }catch(e){}
  const sheet=buildSheet();
  const canvas=await html2canvas(sheet,{scale:2,backgroundColor:"#ffffff",windowWidth:900});
  const { jsPDF } = window.jspdf;
  const pdf=new jsPDF({unit:"mm",format:"a4",orientation:"portrait"});
  const pw=210, ph=297;
  const pxPerPage=Math.floor(canvas.width*ph/pw);
  for(let y=0, page=0; y<canvas.height; y+=pxPerPage, page++){
    const h=Math.min(pxPerPage, canvas.height-y);
    const part=document.createElement('canvas'); part.width=canvas.width; part.height=h;
    part.getContext('2d').drawImage(canvas,0,y,canvas.width,h,0,0,canvas.width,h);
    if(page>0) pdf.addPage();
    pdf.addImage(part.toDataURL("image/jpeg",0.92),"JPEG",0,0,pw,h*pw/canvas.width);
  }
  return pdf.output("blob");
}
let downloadsApi=null;
(async()=>{
  try{ downloadsApi = window.claude && await window.claude.use("downloads"); }catch(e){ downloadsApi=null; }
  document.getElementById('pdfBtn').hidden=false; // 一般瀏覽器改用 <a download> 下載
})();
async function saveBlob(name,blob){
  if(downloadsApi) return downloadsApi.save({filename:name, data:blob});
  const url=URL.createObjectURL(blob), a=document.createElement('a');
  a.href=url; a.download=name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),10000);
}
document.getElementById('pdfBtn').addEventListener('click',async()=>{
  const btn=document.getElementById('pdfBtn');
  const left=8-state.cells.filter(c=>c.ans.trim()).length;
  btn.disabled=true;
  try{
    const blob=await makePdf();
    const name=`九宮格寫作_${(state.topic.trim()||"練習").replace(/[\\/:*?"<>|]/g,"").slice(0,30)}.pdf`;
    await saveBlob(name,blob);
    toast(left?`已輸出（還有 ${left} 格未回答）`:"PDF 已輸出");
  }catch(e){
    const code=e&&e.code;
    if(code==="declined") toast("已取消");
    else if(code==="rate_limited") toast("請稍等一下再試");
    else if(e&&e.message==="lib") toast("PDF 元件載入失敗，請重新整理");
    else { toast("這裡無法下載檔案"); if(code==="unavailable"||code==="not_granted") btn.hidden=true; }
  }finally{ btn.disabled=false; }
});

if(!load()) shuffleAll(false);
render();
</script>
